[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neria"
version = "0.3.0-alpha.1"
description = "Plataforma SaaS multiempresa de atendimento pelo WhatsApp"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.35,<2",
    "celery>=5.4,<6",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "openai>=2.0,<3",
    "pwdlib[argon2]>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.18,<1",
    "pypdf>=5,<7",
    "redis>=5,<7",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
