<!DOCTYPE html>
<html>

<head>
    <title>WhatsApp Automation</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #ece5dd;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 15px;
            font-size: 20px;
        }

        .messages {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            padding: 10px;
            margin: 8px;
            border-radius: 8px;
            max-width: 70%;
        }

        .user {
            background: #dcf8c6;
            margin-left: auto;
        }

        .bot {
            background: #ffffff;
            border: 1px solid #ddd;
        }

        .input-area {
            display: flex;
            padding: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

    </style>

</head>


<body>


<div class="chat-container">

    <div class="header">
        WhatsApp Automation
    </div>


    <div id="messages" class="messages">

    </div>


    <div class="input-area">

        <input id="message" placeholder="Digite uma mensagem" onkeydown="handleEnter(event)">

        <button onclick="sendMessage()">
            Enviar
        </button>

    </div>


</div>



<script>

function handleEnter(event){

    if(event.key === "Enter"){
        sendMessage();
    }

}

function addMessage(text, type){

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerText = text;

    document.getElementById("messages")
        .appendChild(div);

}



async function sendMessage(){

    const input = document.getElementById("message");

    const message = input.value;


    if(!message){
        return;
    }


    addMessage(message, "user");


    input.value = "";


    const response = await fetch("/message", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            phone:"demo-user",

            message:message

        })

    });


    const data = await response.json();


    addMessage(data.response, "bot");

}


</script>


</body>

</html>
