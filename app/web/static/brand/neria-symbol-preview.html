<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia do símbolo Neria</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:48px;background:#f4f8fa;color:#17313d;font-family:Inter,Segoe UI,sans-serif}
    main{max-width:920px;margin:auto;padding:42px;border-radius:24px;background:#fff;box-shadow:0 18px 50px #16435918}
    h1{margin:0 0 8px;font-family:Georgia,serif}.muted{margin:0 0 38px;color:#6b7e87}
    .hero{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}.hero img{width:100%;max-width:360px;margin:auto}
    .dark{display:grid;place-items:center;aspect-ratio:1;border-radius:28px;background:#092d40}.dark img{width:62%}
    h2{margin-top:46px}.sizes{display:flex;gap:28px;align-items:end;padding:28px;border:1px solid #dfe9ed;border-radius:16px}
    .size{text-align:center;color:#71848d;font-size:12px}.size img{display:block;margin:0 auto 9px}.s16{width:16px}.s24{width:24px}.s32{width:32px}.s48{width:48px}.s80{width:80px}
    @media(max-width:650px){body{padding:18px}main{padding:25px}.hero{grid-template-columns:1fr}.sizes{gap:18px;overflow:auto}}
  </style>
</head>
<body><main>
  <h1>Símbolo Neria</h1><p class="muted">Estudo vetorial v1 · azul-oceano #0877A8</p>
  <section class="hero"><img src="neria-symbol-v1.svg" alt="Símbolo Neria sobre fundo claro"><div class="dark"><img src="neria-symbol-v1.svg" alt="Símbolo Neria sobre fundo escuro"></div></section>
  <h2>Leitura reduzida</h2><section class="sizes">
    <div class="size"><img class="s16" src="neria-symbol-v1.svg" alt="16 pixels">16 px</div>
    <div class="size"><img class="s24" src="neria-symbol-v1.svg" alt="24 pixels">24 px</div>
    <div class="size"><img class="s32" src="neria-symbol-v1.svg" alt="32 pixels">32 px</div>
    <div class="size"><img class="s48" src="neria-symbol-v1.svg" alt="48 pixels">48 px</div>
    <div class="size"><img class="s80" src="neria-symbol-v1.svg" alt="80 pixels">80 px</div>
  </section>
</main></body>
</html>
